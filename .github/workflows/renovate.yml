name: Renovate

on:
  schedule:
    # 毎週日曜朝5時(JST)に実行 - UTCでは土曜20時
    - cron: '0 20 * * 6'
  workflow_dispatch:
  # 手動で実行できるようにする

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.10
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: 'info'
          RENOVATE_REPOSITORIES: '["mizo432/modulith-learning"]'
