name: CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - 'main'
      - 'develop'
    paths:
      - 'backend/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Small Tests (Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Small Tests (Unit Tests)
        run: ./gradlew :backend:test

  medium-test:
    name: Medium Tests (Integration Tests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Medium Tests (Integration Tests)
        run: ./gradlew :backend:mediumTest
