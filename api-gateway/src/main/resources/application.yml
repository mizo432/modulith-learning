# application.yml

server:
  port: 8085 # ここに希望するポート番号を設定します
  shutdown: graceful

spring:
  application:
    name: api-gateway-service # アプリケーションの名前を設定します
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: api-departments
              uri: lb://backend/api/departments
              predicates:
                - Path=/api/departments/**
            - id: api-employees
              uri: lb://backend/api/employees
              predicates:
                - Path=/api/employees/**

#  eureka:
#  client:
#    serviceUrl:
#      defaultZone: http://${PROJECT_NAME:-default}-service-registry:8761/eureka
eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka
