# application.yml

server:
  port: 8085 # ここに希望するポート番号を設定します
  shutdown: graceful

spring:
  application:
    name: api-gateway # アプリケーションの名前を設定します
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # REQ-00018: 認可サーバーはHTTPSで提供される
          issuer-uri: https://localhost:8443
          jwk-set-url: https://localhost:8443/oauth2/jwks
          jwt-set-cache-enabled: true
          # REQ-00028: JWKSエンドポイントのレスポンスをキャッシュする
          # REQ-00029: JWTのキャッシュ有効期間は5分以内とする
          # REQ-00021: JWT署名検証にRS256アルゴリズムを使用する
          jws-algorithm: RS256
          # REQ-00030: nbfクレーム (Not Before)が設定されている場合、その時刻以前のトークン使用を拒否する
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: api-departments
              uri: lb://backend/api/departments
              predicates:
                - Path=/api/departments/**
            - id: api-employees
              uri: lb://backend/api/employees
              predicates:
                - Path=/api/employees/**
            - id: api-organizations
              uri: lb://backend/api/organizations
              predicates:
                - Path=/api/organizations/**
            - id: api-roles
              uri: lb://backend/api/roles
              predicates:
                - Path=/api/roles/**
            - id: api-roleAssignmentsFor
              uri: lb://backend/api/roleAssignmentsFor
              predicates:
                - Path=/api/roleAssignmentsFor/**
            - id: api-roleAssignmentsForOrg
              uri: lb://backend/api/roleAssignmentsForOrg
              predicates:
                - Path=/api/roleAssignmentsForOrg/**
            - id: api-users
              uri: lb://backend/api/users
              predicates:
                - Path=/api/users/**
            - id: api-prefectures
              uri: lb://backend/api/prefectures
              predicates:
                - Path=/api/prefectures/**
            - id: api-greeting
              uri: lb://backend/api/greeting
              predicates:
                - Path=/api/greeting/**
            - id: api-greeting1
              uri: lb://backend/api/greeting1
              predicates:
                - Path=/api/greeting1/**
            - id: api-greeting2
              uri: lb://backend/api/greeting2
              predicates:
                - Path=/api/greeting2/**
            - id: api-greeting3
              uri: lb://backend/api/greeting3
              predicates:
                - Path=/api/greeting3/**
            - id: api-greeting4
              uri: lb://backend/api/greeting4
              predicates:
                - Path=/api/greeting4/**
            - id: api-greeting5
              uri: lb://backend/api/greeting5
              predicates:
                - Path=/api/greeting5/**
            - id: api-greeting6
              uri: lb://backend/api/greeting6
              predicates:
                - Path=/api/greeting6/**
            - id: api-greeting7
              uri: lb://backend/api/greeting7
              predicates:
                - Path=/api/greeting7/**
            - id: api-sprints
              uri: lb://backend/api/v1/sprints
              predicates:
                - Path=/api/v1/sprints/**
            - id: api-job-definitions
              uri: lb://backend/api/job-definitions
              predicates:
                - Path=/api/job-definitions/**
            - id: api-job-executions
              uri: lb://backend/api/job-executions
              predicates:
                - Path=/api/job-executions/**
            - id: do-databases
              uri: lb://backend/do/databases
              predicates:
                - Path=/do/databases/**
            - id: api-docs
              uri: lb://backend
              predicates:
                - Path=/v3/api-docs/**
            - id: swagger-ui
              uri: lb://backend
              predicates:
                - Path=/swagger-ui/**

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: backend
        url: /v3/api-docs

#  eureka:
#  client:
#    serviceUrl:
#      defaultZone: http://${PROJECT_NAME:-default}-service-registry:8761/eureka
eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka

# レートリミッティング設定
# 詳細設計書に基づく制限設定
ratelimit:
  # デフォルト（GETリクエスト）: 1分あたり100回
  replenish-rate: 100
  burst-capacity: 200
  period-seconds: 60
  # 認証関連エンドポイント: 1分あたり5回
  auth-replenish-rate: 5
  auth-burst-capacity: 10
  # 書き込み操作（POST/PUT/PATCH/DELETE）: 1分あたり30回
  write-replenish-rate: 30
  write-burst-capacity: 60
