# application.yml

server:
  port: 8085 # ここに希望するポート番号を設定します
  shutdown: graceful

spring:
  application:
    name: api-gateway # アプリケーションの名前を設定します
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # REQ-00018: 認可サーバーはHTTPSで提供される
          issuer-uri: https://localhost:8443
          jwk-set-url: https://localhost:8443/oauth2/jwks
          jwt-set-cache-enabled: true
          # REQ-00028: JWKSエンドポイントのレスポンスをキャッシュする
          # REQ-00029: JWTのキャッシュ有効期間は5分以内とする
          # REQ-00021: JWT署名検証にRS256アルゴリズムを使用する
          jws-algorithm: RS256
          # REQ-00030: nbfクレーム (Not Before)が設定されている場合、その時刻以前のトークン使用を拒否する
  cloud:
    gateway:
      server:
        webmvc:
          # ルーティングは GatewayServerApplication.java の rateLimitedApiRoutes() で定義
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: backend
        url: /v3/api-docs

#  eureka:
#  client:
#    serviceUrl:
#      defaultZone: http://${PROJECT_NAME:-default}-service-registry:8761/eureka
eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka

# レートリミッティング設定
# 詳細設計書に基づく制限設定
ratelimit:
  # Redisベースの分散レートリミッティングを有効化
  # falseの場合、インメモリのローカルバケットにフォールバックします
  redis:
    enabled: true
  # デフォルト（GETリクエスト）: 1分あたり100回
  capacity: 100
  burst-capacity: 200
  period-seconds: 60
  # 認証関連エンドポイント: 1分あたり5回
  auth-capacity: 5
  auth-burst-capacity: 10
  # トークン更新エンドポイント: 1分あたり10回
  auth-refresh-capacity: 10
  # 書き込み操作（POST/PUT/PATCH/DELETE）: 1分あたり30回
  write-capacity: 30
  write-burst-capacity: 60
