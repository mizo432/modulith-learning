server:
  shutdown: graceful
  port: 8080
spring:
  main:
    lazy-initialization: on
  application:
    name: backend
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SYSTEM_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 20000                  # Default: 30,000 (30 seconds)
      minimum-idle: 11                            # Default: same as maximumPoolSize
      maximum-pool-size: 11
      max-lifetime: 1800000
      idle-timeout: 600000
      keepalive-time: 0
  flyway:
    enabled: true
    outOfOrder: true
    baseline-on-migrate: true
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    url: ${SYSTEM_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    # 事業領域ごとのマイグレーションlocations
    # data-designスキルに従い、事業領域ごとにスキーマを分離する
    locations: >
      classpath:db/migration/ag,
      classpath:db/migration/as,
      classpath:db/migration/do,
      classpath:db/migration/ef,
      classpath:db/migration/pc,
      classpath:db/migration/ar,
      classpath:db/migration/az,
      classpath:db/migration/nt
    mvc:
      problemdetails:
        enabled: true
  
  jackson:
    date-format: com.fasterxml.jackson.databind.util.ISO8601DateFormat
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties.hibernate.format_sql: true
    properties.hibernate.jdbc.lob.non_contextual_creation: true
    properties.hibernate.hbm2ddl.create_namespaces: true
#    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      database: 1
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp:
      auth: true
      starttls.enable: true

batch:
  bank-import:
    cron: "0 0 4 * * ?"
    zip-dir: ${java.io.tmpdir}
    bankcode-jp:
      base-url: https://apis.bankcode-jp.com
      api-key: ${BANKCODE_JP_API_KEY:}

hikari:
  auto-tuning:
    enabled: false
    interval-seconds: 60
    max-pool-size-limit: 50
    min-idle-limit: 1
    max-adjustment-step: 3
    timeout-safety-margin: 5
    history-window-size: 10
    ewa-alpha: 0.3
    cpu-threshold: 80.0
    query-latency-threshold: 1000.0
    adjust-idle-timeout: false
    adjust-max-lifetime: false
    timeout-fallback-threshold: 3
    fallback-pool-size: 30

eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka
# 帳票ストレージ（MinIO / S3互換）
document-storage:
  endpoint: ${DOCUMENT_STORAGE_ENDPOINT:http://localhost:9000}
  region: ${DOCUMENT_STORAGE_REGION:us-east-1}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${DOCUMENT_STORAGE_BUCKET:modulith-documents}
management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,modulithApplications
  endpoint:
    health:
      show-details: always
