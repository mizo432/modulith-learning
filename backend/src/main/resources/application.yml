server:
  shutdown: graceful
  port: 8080
  servlet:
    context-path: /modulith
spring:
  main:
    lazy-initialization: on
  application:
    name: backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SYSTEM_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 20000                  # Default: 30,000 (30 seconds)
      minimum-idle: 11                            # Default: same as maximumPoolSize
      maximum-pool-size: 11
      max-lifetime: 1800000
      idle-timeout: 600000
      keepalive-time: 0
    #  flyway:
    #    enabled: false
    #    outOfOrder: true
    #    locations: classpath:db/migration, classpath:db/migration_local
    #    baseline-on-migrate: true
    #    user: ${POSTGRES_USER:postgres}
    #    password: ${POSTGRES_PASSWORD:postgres}
    #    url: ${SYSTEM_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    mvc:
      problemdetails:
        enabled: true
  
  jackson:
    date-format: com.fasterxml.jackson.databind.util.ISO8601DateFormat
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties.hibernate.format_sql: true
    properties.hibernate.jdbc.lob.non_contextual_creation: true
#    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,modulithApplications
  endpoint:
    health:
      show-details: always
