# SonarQube / SonarCloud 接続設定
# SonarCloud の場合
sonar.host.url=https://sonarcloud.io
# 自前 SonarQube の場合は以下を有効化
# sonar.host.url=http://localhost:9000

# プロジェクト識別子
# SonarCloud の場合は「organization/project」形式
sonar.projectKey=modulith-learning
sonar.organization=modulith-learning
sonar.projectName=modulith-learning

# 認証トークン
# CI/CD では環境変数 SONAR_TOKEN で設定
# ローカル開発ではここに設定也可
# sonar.login=your_token_here

# ソースコードの言語とエンコーディング
sonar.sources=.
sonar.sourceEncoding=UTF-8

# 分析対象の言語
sonar.language=java
sonar.java.source=25

# 分析対象のモジュール
sonar.modules=backend,service-registry,api-gateway,authorization,mizo432-shared-common,frontend

# 各モジュールのソースディレクトリ設定
# backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java,src/mediumTest/java,src/largeTest/java
backend.sonar.java.binaries=build/classes/java/main
backend.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# service-registry
service-registry.sonar.sources=src/main/java
service-registry.sonar.tests=src/test/java
service-registry.sonar.java.binaries=build/classes/java/main

# api-gateway
api-gateway.sonar.sources=src/main/java
api-gateway.sonar.tests=src/test/java
api-gateway.sonar.java.binaries=build/classes/java/main

# authorization
authorization.sonar.sources=src/main/java
authorization.sonar.tests=src/test/java
authorization.sonar.java.binaries=build/classes/java/main

# mizo432-shared-common
mizo432-shared-common.sonar.sources=src/main/java
mizo432-shared-common.sonar.tests=src/test/java
mizo432-shared-common.sonar.java.binaries=build/classes/java/main

# frontend (TypeScript/JavaScript)
frontend.sonar.sources=src
frontend.sonar.tests=src
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

# 除外パターン
sonar.exclusions=**/build/**,**/test/**,**/mediumTest/**,**/largeTest/**,**/node_modules/**,**/generated/**,**/*Test.java,**/*Tests.java,**/test/**,**/resources/**,**/*.properties,**/*.xml,**/db/migration/**

# テスト除外
sonar.test.exclusions=**/test/**,**/mediumTest/**,**/largeTest/**

# カバレッジ設定
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/dto/**,**/entity/**,**/exception/**,**/*Exception.java

# 重複コード検出
sonar.cpd.exclusions=**/dto/**,**/entity/**

# PR 装饰設定 (GitHub)
sonar.pullrequest.github.enabled=true
sonar.pullrequest.github.repository=modulith-learning

# 品質ゲート
sonar.qualitygate.wait=true
