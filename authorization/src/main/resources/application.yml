server:
  shutdown: graceful
  port: 8082
spring:
  application:
    name: authorization
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SYSTEM_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000                  # Default: 30000 (30 seconds)
      minimum-idle: 2                            # Default: same as maximumPoolSize
      maximum-pool-size: 10
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties.hibernate.format_sql: true
    properties.hibernate.jdbc.lob.non_contextual_creation: true
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    date-format: com.fasterxml.jackson.databind.util.ISO8601DateFormat
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

logging:
  level:
    root: warn
    web: info
    org.zalando.logbook: trace
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.hibernate.SQL: DEBUG

eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,modulithApplications
  endpoint:
    health:
      show-details: always
